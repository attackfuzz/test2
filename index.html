<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星座ビューア 設定UI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #06111f;
  color: #eef7ff;
}
.settings-sheet {
  position: fixed;
  left: 0;
  top: 0;
  width: min(88vw, 360px);
  height: 100dvh;
  padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)) 14px;
  background: rgba(8, 20, 34, 0.96);
  backdrop-filter: blur(16px);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}
.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 38px;
}
.settings-title {
  margin: 0;
  font-size: 21px;
  font-weight: 700;
}
.close-button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 22px;
  cursor: pointer;
}
.setting-group {
  padding: 11px 12px;
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 13px;
  background: rgba(255,255,255,0.035);
}
.setting-label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 700;
  color: #a9c7df;
}
.button-row {
  display: flex;
  gap: 7px;
}
.ui-button {
  flex: 1;
  min-height: 36px;
  padding: 7px 10px;
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 9px;
  background: rgba(255,255,255,0.07);
  color: white;
  font-size: 14px;
  cursor: pointer;
}
.ui-button.active {
  background: #1976a8;
  border-color: #54bce8;
}
.location-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 7px;
}
select,
.star-display-select {
  width: 100%;
  height: 36px;
  padding: 0 9px;
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 9px;
  background: #102438;
  color: white;
  font-size: 14px;
}
.coordinate-button { min-width: 112px; }
.zoom-row {
  display: grid;
  grid-template-columns: 1fr 55px;
  gap: 10px;
  align-items: center;
}
.zoom-slider { width: 100%; }
.zoom-value {
  text-align: right;
  font-size: 13px;
  color: #b8dcf4;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.switch {
  position: relative;
  width: 48px;
  height: 26px;
}
.switch input { display: none; }
.slider {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: #394858;
  cursor: pointer;
  transition: 0.2s;
}
.slider::before {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  left: 3px;
  top: 3px;
  border-radius: 50%;
  background: white;
  transition: 0.2s;
}
.switch input:checked + .slider { background: #168dc3; }
.switch input:checked + .slider::before { transform: translateX(22px); }
@media (max-height: 650px) {
  .settings-sheet { gap: 7px; }
  .setting-group { padding: 8px 10px; }
  .settings-header { min-height: 32px; }
  .ui-button,
  select { height: 34px; min-height: 34px; }
}
</style>
</head>
<body>
<aside class="settings-sheet">
  <header class="settings-header">
    <h2 class="settings-title">設定</h2>
    <button class="close-button">×</button>
  </header>

  <section class="setting-group">
    <span class="setting-label">モード</span>
    <div class="button-row">
      <button id="groundModeButton" class="ui-button active">地上</button>
      <button id="overviewModeButton" class="ui-button">俯瞰</button>
    </div>
  </section>

  <section class="setting-group">
    <span class="setting-label">観測地点</span>
    <div class="location-row">
      <select id="locationSelect">
        <option value="tokyo">東京</option>
        <option value="sapporo">札幌</option>
        <option value="naha">那覇</option>
      </select>
      <button id="coordinateButton" class="ui-button coordinate-button">緯度・経度</button>
    </div>
  </section>

  <section class="setting-group">
    <span class="setting-label">ズーム</span>
    <div class="zoom-row">
      <input id="zoomSlider" class="zoom-slider" type="range" min="6" max="50" value="50">
      <div id="zoomValue" class="zoom-value">50mm</div>
    </div>
  </section>

  <section class="setting-group">
    <span class="setting-label">星の表示</span>
    <select id="starDisplaySelect" class="star-display-select">
      <option value="none">表示なし</option>
      <option value="star">星名</option>
      <option value="constellation-en">星座（英名）</option>
      <option value="constellation-ja">星座（日本名）</option>
    </select>
  </section>

  <section class="setting-group">
    <div class="toggle-row">
      <span class="setting-label" style="margin:0;">背景星</span>
      <label class="switch">
        <input id="backgroundStarsToggle" type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
  </section>
</aside>

<script>
const groundButton = document.getElementById("groundModeButton");
const overviewButton = document.getElementById("overviewModeButton");

groundButton.addEventListener("click", () => {
  groundButton.classList.add("active");
  overviewButton.classList.remove("active");
  console.log("地上モード");
});

overviewButton.addEventListener("click", () => {
  overviewButton.classList.add("active");
  groundButton.classList.remove("active");
  console.log("俯瞰モード");
});

document.getElementById("locationSelect").addEventListener("change", event => {
  console.log("観測地点:", event.target.value);
});

document.getElementById("coordinateButton").addEventListener("click", () => {
  console.log("緯度経度入力画面を開く");
});

const zoomSlider = document.getElementById("zoomSlider");
const zoomValue = document.getElementById("zoomValue");
zoomSlider.addEventListener("input", event => {
  const mm = Number(event.target.value);
  zoomValue.textContent = `${mm}mm`;
  console.log("レンズ:", mm);
});

document.getElementById("starDisplaySelect").addEventListener("change", event => {
  console.log("星表示:", event.target.value);
});

document.getElementById("backgroundStarsToggle").addEventListener("change", event => {
  console.log("背景星:", event.target.checked);
});
</script>
</body>
</html>
