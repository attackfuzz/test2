<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星座探索 - JSファイル対応</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; touch-action: none; }
        #controls {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 100;
            width: min(340px, calc(100vw - 32px));
            display: flex;
            flex-direction: column;
            gap: 9px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 0, 18, 0.78);
            color: #ffffff;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        #controls select, #controls button, #controls label, #controls input[type=range] {
            font-size: 14px;
        }
        #controls select, #controls button {
            padding: 8px;
        }
        .control-row {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-row > span {
            min-width: 58px;
            opacity: 0.8;
        }
        .view-button {
            flex: 1;
            min-width: 75px;
            cursor: pointer;
        }
        .view-button.active {
            outline: 2px solid #77bbff;
            background: #dceeff;
        }
        .check-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px;
        }
        .lens-control {
            display: grid;
            grid-template-columns: auto minmax(150px, 1fr) auto;
            align-items: center;
            gap: 8px;
        }
        .lens-control input[type=range] {
            width: 190px;
            padding: 0;
        }
        #lensValue {
            min-width: 92px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .background-control {
            display: grid;
            grid-template-columns: auto minmax(130px, 1fr) auto;
            align-items: center;
            gap: 8px;
        }
        .background-control input[type=range] { width: 165px; }
        #backgroundMagnitudeValue {
            min-width: 42px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        #controlHint {
            font-size: 12px;
            opacity: 0.72;
            line-height: 1.4;
        }
        #constellationLabels {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            overflow: hidden;
        }
        .constellation-label {
            position: absolute;
            transform: translate(-50%, calc(-100% - 10px));
            padding: 3px 7px;
            border-radius: 4px;
            background: rgba(0, 0, 20, 0.68);
            color: #ffffff;
            font-size: 13px;
            line-height: 1.2;
            white-space: nowrap;
            text-shadow: 0 1px 2px #000000;
            opacity: 0.82;
        }
        .constellation-label.selected {
            color: #ff7777;
            font-weight: bold;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="controls">
        <select id="constellationSelect">
            <option value="">星座を選択してください</option>
        </select>

        <div class="control-row">
            <span>視点</span>
            <button class="view-button" data-view="ground">地上</button>
            <button class="view-button active" data-view="center">天球中心</button>
            <button class="view-button" data-view="overview">地球俯瞰</button>
        </div>

        <div class="control-row">
            <span>ドラッグ</span>
            <select id="dragModeSelect">
                <option value="look">視線を動かす</option>
                <option value="orbit">地球を中心に周回</option>
            </select>
        </div>

        <div class="control-row">
            <span>方向</span>
            <label class="check-label"><input type="checkbox" id="invertHorizontal">横反転</label>
            <label class="check-label"><input type="checkbox" id="invertVertical">縦反転</label>
        </div>

        <div class="control-row lens-control">
            <span>地上レンズ</span>
            <input type="range" id="groundLensSlider" min="6" max="50" step="0.5" value="50">
            <span id="lensValue">50mm / 27°</span>
        </div>

        <div class="control-row">
            <span>背景星</span>
            <label class="check-label"><input type="checkbox" id="backgroundStarsToggle" checked>表示</label>
        </div>

        <div class="control-row background-control">
            <span>限界等級</span>
            <input type="range" id="backgroundMagnitudeSlider" min="3" max="6" step="0.1" value="6">
            <span id="backgroundMagnitudeValue">6.0等</span>
        </div>

        <label class="check-label">
            <input type="checkbox" id="cameraFocusToggle" checked>
            北極星固定
        </label>

        <div id="controlHint">左ドラッグ：開始点基準で回転　／　ホイール・ピンチ：距離または視野角</div>
    </div>
    <div id="constellationLabels"></div>
    <script src="stars.js"></script> <!-- stars.js を読み込み -->
    <script src="starline.js"></script> <!-- starline.js を読み込み -->
    <script src="background_stars.js"></script> <!-- 6等級までの背景星 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(27, window.innerWidth / window.innerHeight, 0.5, 250000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        renderer.setClearColor(0x000011);

        const earthGroup = new THREE.Group();
        const earthGeometry = new THREE.SphereGeometry(1000, 96, 64);

        // 地表本体。地上視点では足元から地平線までを覆う。
        const groundMaterial = new THREE.MeshBasicMaterial({
            color: 0x07180d,
            opacity: 0.96,
            transparent: true,
            depthWrite: true,
            side: THREE.FrontSide
        });
        const groundEarth = new THREE.Mesh(earthGeometry, groundMaterial);
        earthGroup.add(groundEarth);

        // 従来の地球ワイヤーフレームは地表の上に重ねて残す。
        const earthMaterial = new THREE.MeshBasicMaterial({
            color: 0x168a42,
            wireframe: true,
            opacity: 0.3,
            transparent: true,
            depthWrite: false
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earth.scale.setScalar(1.002);
        earthGroup.add(earth);
        scene.add(earthGroup);

        // 地上モード専用の接平面グリッド。外周は透明にして地平線付近へ届かせない。
        const groundGridTexture = createGroundGridTexture();
        const groundGridMaterial = new THREE.MeshBasicMaterial({
            map: groundGridTexture,
            transparent: true,
            opacity: 0,
            depthWrite: false,
            side: THREE.DoubleSide
        });
        const groundGrid = new THREE.Mesh(
            new THREE.PlaneGeometry(140, 140),
            groundGridMaterial
        );
        groundGrid.rotation.x = -Math.PI / 2;
        groundGrid.position.set(0, 1000 + 0.03, 0);
        groundGrid.renderOrder = 2;
        scene.add(groundGrid);

        const backgroundStarGroup = new THREE.Group();
        const starGroup = new THREE.Group();
        const lineGroup = new THREE.Group();
        scene.add(backgroundStarGroup);
        scene.add(starGroup);
        scene.add(lineGroup);

        const constellationSelect = document.getElementById('constellationSelect');
        const cameraFocusToggle = document.getElementById('cameraFocusToggle');
        const constellationLabelsLayer = document.getElementById('constellationLabels');
        const groundLensSlider = document.getElementById('groundLensSlider');
        const lensValue = document.getElementById('lensValue');
        const dragModeSelect = document.getElementById('dragModeSelect');
        const invertHorizontalToggle = document.getElementById('invertHorizontal');
        const invertVerticalToggle = document.getElementById('invertVertical');
        const viewButtons = Array.from(document.querySelectorAll('.view-button'));
        const backgroundStarsToggle = document.getElementById('backgroundStarsToggle');
        const backgroundMagnitudeSlider = document.getElementById('backgroundMagnitudeSlider');
        const backgroundMagnitudeValue = document.getElementById('backgroundMagnitudeValue');

        const starPositions = {};
        const starMeshes = {};
        const lineMeshes = {};
        const starPositionLists = {};
        const constellationFirstStarPositions = {};
        const constellationLabelElements = {};
        let backgroundStarLayers = [];

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let previousTouchPosition = { x: 0, y: 0 };
        let dragStartPosition = { x: 0, y: 0 };
        let dragStartQuaternion = new THREE.Quaternion();
        let dragStartUp = new THREE.Vector3(0, 1, 0);
        let dragStartRight = new THREE.Vector3(1, 0, 0);

        // 表示スケール：地表の曲率と天球の視差を抑えた地上観測向け設定
        const EARTH_RADIUS = 1000;
        const OBSERVER_HEIGHT = 1.7;
        const SKY_RADIUS = 100000;
        const OVERVIEW_DISTANCE = EARTH_RADIUS * 3;
        const FULL_FRAME_SENSOR_HEIGHT = 24;
        const GROUND_DEFAULT_FOCAL_LENGTH = 50;
        const GROUND_MIN_FOCAL_LENGTH = 6;
        const moveSpeed = 50;
        const rotationSpeed = 0.01;
        const orbitSpeed = 0.008;

        let focusOnNorthStar = true;
        let cameraAnimation = null;
        let activeViewPreset = 'center';
        let currentViewMode = 'center';
        let groundAzimuth = 0;
        let groundAltitude = THREE.MathUtils.degToRad(1.75);
        const GROUND_MIN_ALTITUDE = THREE.MathUtils.degToRad(-5);
        const GROUND_MAX_ALTITUDE = THREE.MathUtils.degToRad(89);
        let pinchStartDistance = null;
        const cameraFocusDuration = 900;
        const viewTransitionDuration = 1200;

        // クォータニオンによるカメラの回転制御
        let cameraQuaternion = new THREE.Quaternion();
        camera.quaternion.copy(cameraQuaternion);

        cameraFocusToggle.addEventListener('change', function() {
            cancelCameraAnimation();
            focusOnNorthStar = cameraFocusToggle.checked;
            syncCameraQuaternion();

            if (focusOnNorthStar) {
                dragModeSelect.value = 'look';
                lookAtNorthStar();
            }
        });

        groundLensSlider.addEventListener('input', function() {
            cancelCameraAnimation();
            const focalLength = parseFloat(groundLensSlider.value);
            setCameraFocalLength(focalLength);
            clearActiveViewPreset();
        });

        backgroundStarsToggle.addEventListener('change', function() {
            backgroundStarGroup.visible = backgroundStarsToggle.checked;
        });

        backgroundMagnitudeSlider.addEventListener('input', function() {
            const limit = parseFloat(backgroundMagnitudeSlider.value);
            backgroundMagnitudeValue.textContent = `${limit.toFixed(1)}等`;
            buildBackgroundStarLayers(limit);
        });

        viewButtons.forEach(button => {
            button.addEventListener('click', () => applyViewPreset(button.dataset.view));
        });

        dragModeSelect.addEventListener('change', () => {
            cancelCameraAnimation();
            if (dragModeSelect.value === 'orbit') {
                focusOnNorthStar = false;
                cameraFocusToggle.checked = false;
                camera.lookAt(new THREE.Vector3(0, 0, 0));
                syncCameraQuaternion();
            }
        });

        const northStarPosition = convertToCartesian(2.530301028 * 15, 89.26413889); 

        if (focusOnNorthStar) {
            lookAtNorthStar(); 
        }

        // マウス操作
        document.addEventListener('mousedown', function (event) {
            if (event.button === 0) {
                isDragging = true;
                previousMousePosition = { x: event.clientX, y: event.clientY };
                beginAnchoredDrag(previousMousePosition);
            }
        });

        document.addEventListener('mousemove', function (event) {
            if (isDragging) {
                const currentMousePosition = { x: event.clientX, y: event.clientY };
                handleDrag(currentMousePosition, previousMousePosition);
                previousMousePosition = currentMousePosition;
            }
        });

        document.addEventListener('mouseup', function () {
            isDragging = false;
        });

        // タッチ操作
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length === 1) {
                event.preventDefault();
                isDragging = true;
                pinchStartDistance = null;
                previousTouchPosition = { x: event.touches[0].clientX, y: event.touches[0].clientY };
                beginAnchoredDrag(previousTouchPosition);
            } else if (event.touches.length === 2) {
                event.preventDefault();
                isDragging = false;
                pinchStartDistance = getTouchDistance(event.touches);
            }
        }, { passive: false });

        document.addEventListener('touchmove', function (event) {
            if (event.touches.length === 1 && isDragging) {
                event.preventDefault();
                const currentTouchPosition = { x: event.touches[0].clientX, y: event.touches[0].clientY };
                handleDrag(currentTouchPosition, previousTouchPosition);
                previousTouchPosition = currentTouchPosition;
            } else if (event.touches.length === 2) {
                event.preventDefault();
                const distance = getTouchDistance(event.touches);
                if (pinchStartDistance !== null && pinchStartDistance > 0) {
                    applyZoom((pinchStartDistance - distance) * 0.006);
                }
                pinchStartDistance = distance;
            }
        }, { passive: false });

        document.addEventListener('touchend', function (event) {
            isDragging = false;
            if (event.touches.length < 2) pinchStartDistance = null;
        });

        document.addEventListener('touchcancel', function () {
            isDragging = false;
            pinchStartDistance = null;
        });

        renderer.domElement.addEventListener('wheel', function(event) {
            event.preventDefault();
            cancelCameraAnimation();
            applyZoom(event.deltaY * 0.0025);
        }, { passive: false });

        function beginAnchoredDrag(position) {
            if (currentViewMode === 'ground') {
                syncGroundAnglesFromCamera();
            }
            dragStartPosition = { x: position.x, y: position.y };
            dragStartQuaternion.copy(camera.quaternion);
            dragStartUp.set(0, 1, 0).applyQuaternion(dragStartQuaternion).normalize();
            dragStartRight.set(1, 0, 0).applyQuaternion(dragStartQuaternion).normalize();
        }

        function handleDrag(currentPosition, previousPosition) {
            cancelCameraAnimation();
            const incrementalDelta = getDragDelta(currentPosition, previousPosition);
            const totalDelta = getDragDelta(currentPosition, dragStartPosition);
            const signX = invertHorizontalToggle.checked ? -1 : 1;
            const signY = invertVerticalToggle.checked ? -1 : 1;

            if (currentViewMode === 'ground') {
                rotateGroundCamera({
                    x: incrementalDelta.x * signX,
                    y: incrementalDelta.y * signY
                });
            } else if (dragModeSelect.value === 'orbit') {
                orbitAroundEarth({
                    x: incrementalDelta.x * signX,
                    y: incrementalDelta.y * signY
                });
            } else if (focusOnNorthStar) {
                moveFocusCamera({
                    x: incrementalDelta.x * signX,
                    y: incrementalDelta.y * signY
                });
            } else {
                rotateFreeCameraAnchored({
                    x: totalDelta.x * signX,
                    y: totalDelta.y * signY
                });
            }
        }

        function getDragDelta(currentPosition, previousPosition) {
            return {
                x: currentPosition.x - previousPosition.x,
                y: currentPosition.y - previousPosition.y
            };
        }

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.hypot(dx, dy);
        }

        function rotateGroundCamera(delta) {
            // 地上モードは自由3D回転を使わない。
            // 横入力は固定された鉛直軸まわりの方位角、縦入力は高度角として独立管理する。
            groundAzimuth -= delta.x * rotationSpeed;
            groundAltitude -= delta.y * rotationSpeed;
            groundAltitude = THREE.MathUtils.clamp(
                groundAltitude,
                GROUND_MIN_ALTITUDE,
                GROUND_MAX_ALTITUDE
            );

            applyGroundCameraOrientation();
        }

        function applyGroundCameraOrientation() {
            const localUp = camera.position.clone().normalize();
            // 現在は北極配置なので、+Zを方位角0度の水平基準とする。
            // 将来ほかの観測地点へ移した際は、この水平基準を現地の北方向へ置き換えられる。
            const north = new THREE.Vector3(0, 0, 1);
            const east = new THREE.Vector3(1, 0, 0);
            const cosAltitude = Math.cos(groundAltitude);

            const direction = new THREE.Vector3()
                .addScaledVector(north, Math.cos(groundAzimuth) * cosAltitude)
                .addScaledVector(east, Math.sin(groundAzimuth) * cosAltitude)
                .addScaledVector(localUp, Math.sin(groundAltitude))
                .normalize();

            camera.up.copy(localUp);
            camera.lookAt(camera.position.clone().add(direction));
            syncCameraQuaternion();
        }

        function syncGroundAnglesFromCamera() {
            const localUp = camera.position.clone().normalize();
            const direction = new THREE.Vector3(0, 0, -1)
                .applyQuaternion(camera.quaternion)
                .normalize();

            groundAltitude = Math.asin(THREE.MathUtils.clamp(
                direction.dot(localUp),
                -1,
                1
            ));
            groundAltitude = THREE.MathUtils.clamp(
                groundAltitude,
                GROUND_MIN_ALTITUDE,
                GROUND_MAX_ALTITUDE
            );

            const horizontal = direction.clone()
                .addScaledVector(localUp, -direction.dot(localUp));
            if (horizontal.lengthSq() > 1e-10) {
                horizontal.normalize();
                groundAzimuth = Math.atan2(horizontal.x, horizontal.z);
            }
        }

        function moveFocusCamera(delta) {
            camera.position.x -= delta.x * moveSpeed * 0.01;
            camera.position.y += delta.y * moveSpeed * 0.01;
            lookAtNorthStar();
        }

        function rotateFreeCameraAnchored(totalDelta) {
            // ドラッグ開始時の姿勢と軸を固定し、開始点からの総移動量で毎回再計算する。
            // 増分を積み重ねないため、長く操作しても回転軸が漂いにくい。
            const yaw = new THREE.Quaternion().setFromAxisAngle(
                dragStartUp,
                -totalDelta.x * rotationSpeed
            );
            const pitch = new THREE.Quaternion().setFromAxisAngle(
                dragStartRight,
                -totalDelta.y * rotationSpeed
            );

            cameraQuaternion.copy(dragStartQuaternion);
            cameraQuaternion.premultiply(yaw);
            cameraQuaternion.premultiply(pitch);
            camera.quaternion.copy(cameraQuaternion);
            clearActiveViewPreset();
        }

        function orbitAroundEarth(delta) {
            const radius = Math.max(camera.position.length(), EARTH_RADIUS + OBSERVER_HEIGHT + 5);
            const spherical = new THREE.Spherical().setFromVector3(camera.position);
            spherical.theta -= delta.x * orbitSpeed;
            spherical.phi += delta.y * orbitSpeed;
            spherical.phi = THREE.MathUtils.clamp(spherical.phi, 0.05, Math.PI - 0.05);
            spherical.radius = radius;

            camera.position.setFromSpherical(spherical);
            camera.lookAt(0, 0, 0);
            syncCameraQuaternion();
            clearActiveViewPreset();
        }

        function createGroundGridTexture() {
            const size = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            const center = size / 2;

            context.clearRect(0, 0, size, size);

            // 小グリッドと大グリッドを描き分ける。
            const divisions = 28;
            const step = size / divisions;
            for (let i = 0; i <= divisions; i++) {
                const major = i % 5 === 0;
                context.beginPath();
                context.strokeStyle = major
                    ? 'rgba(80, 220, 150, 0.52)'
                    : 'rgba(55, 150, 105, 0.22)';
                context.lineWidth = major ? 2 : 1;
                context.moveTo(i * step, 0);
                context.lineTo(i * step, size);
                context.stroke();

                context.beginPath();
                context.moveTo(0, i * step);
                context.lineTo(size, i * step);
                context.stroke();
            }

            // 外周を透明化して、地平線付近の不自然な線を消す。
            context.globalCompositeOperation = 'destination-in';
            const gradient = context.createRadialGradient(center, center, size * 0.18, center, center, size * 0.5);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.68, 'rgba(255,255,255,0.95)');
            gradient.addColorStop(0.86, 'rgba(255,255,255,0.35)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, size, size);
            context.globalCompositeOperation = 'source-over';

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            return texture;
        }

        function focalLengthToVerticalFov(focalLengthMm) {
            return THREE.MathUtils.radToDeg(
                2 * Math.atan(FULL_FRAME_SENSOR_HEIGHT / (2 * focalLengthMm))
            );
        }

        function verticalFovToFocalLength(verticalFovDeg) {
            const fovRad = THREE.MathUtils.degToRad(verticalFovDeg);
            return FULL_FRAME_SENSOR_HEIGHT / (2 * Math.tan(fovRad / 2));
        }

        function updateLensDisplay(focalLengthMm, verticalFovDeg) {
            lensValue.textContent = `${focalLengthMm.toFixed(1).replace('.0', '')}mm / ${verticalFovDeg.toFixed(1)}°`;
        }

        function setCameraFocalLength(focalLengthMm) {
            const clamped = THREE.MathUtils.clamp(
                focalLengthMm,
                GROUND_MIN_FOCAL_LENGTH,
                GROUND_DEFAULT_FOCAL_LENGTH
            );
            const fov = focalLengthToVerticalFov(clamped);
            camera.fov = fov;
            camera.updateProjectionMatrix();
            groundLensSlider.value = String(clamped);
            updateLensDisplay(clamped, fov);
        }

        function applyZoom(amount) {
            if (dragModeSelect.value === 'orbit' || activeViewPreset === 'overview') {
                const direction = camera.position.clone().normalize();
                const nextRadius = THREE.MathUtils.clamp(
                    camera.position.length() * Math.exp(amount),
                    EARTH_RADIUS + OBSERVER_HEIGHT + 10,
                    1200
                );
                camera.position.copy(direction.multiplyScalar(nextRadius));
                camera.lookAt(0, 0, 0);
                syncCameraQuaternion();
            } else {
                const minFov = focalLengthToVerticalFov(GROUND_DEFAULT_FOCAL_LENGTH);
                const maxFov = focalLengthToVerticalFov(GROUND_MIN_FOCAL_LENGTH);
                camera.fov = THREE.MathUtils.clamp(camera.fov + amount * 12, minFov, maxFov);
                camera.updateProjectionMatrix();
                const focalLength = verticalFovToFocalLength(camera.fov);
                groundLensSlider.value = String(THREE.MathUtils.clamp(
                    focalLength,
                    GROUND_MIN_FOCAL_LENGTH,
                    GROUND_DEFAULT_FOCAL_LENGTH
                ));
                updateLensDisplay(focalLength, camera.fov);
            }
            clearActiveViewPreset();
        }

        function lookAtNorthStar() {
            camera.lookAt(northStarPosition);
            syncCameraQuaternion();
        }

        function syncCameraQuaternion() {
            // lookAt方式と自由回転方式の切替で向きが飛ばないように、現在のカメラ姿勢を同期する
            camera.updateMatrixWorld();
            cameraQuaternion.copy(camera.quaternion);
        }

        function cancelCameraAnimation() {
            if (!cameraAnimation) return;
            cameraAnimation = null;
            syncCameraQuaternion();
        }

        function setActiveViewPreset(name) {
            activeViewPreset = name;
            backgroundStarsToggle.addEventListener('change', function() {
            backgroundStarGroup.visible = backgroundStarsToggle.checked;
        });

        backgroundMagnitudeSlider.addEventListener('input', function() {
            const limit = parseFloat(backgroundMagnitudeSlider.value);
            backgroundMagnitudeValue.textContent = `${limit.toFixed(1)}等`;
            buildBackgroundStarLayers(limit);
        });

        viewButtons.forEach(button => {
                button.classList.toggle('active', button.dataset.view === name);
            });
        }

        function clearActiveViewPreset() {
            setActiveViewPreset('');
        }

        function applyViewPreset(name) {
            cancelCameraAnimation();
            currentViewMode = name;
            focusOnNorthStar = false;
            cameraFocusToggle.checked = false;

            let targetPosition;
            let targetLookAt;
            let targetFov;
            let targetEarthOpacity;
            let targetGroundOpacity;
            let targetGridOpacity;

            if (name === 'ground') {
                // 北極付近の地表から、地平線より少し上を見る。
                // 地面が画面下部に入り、空との境界が地平線になる。
                targetPosition = new THREE.Vector3(0, EARTH_RADIUS + OBSERVER_HEIGHT, 0);
                groundAzimuth = 0;
                groundAltitude = THREE.MathUtils.degToRad(1.75);
                targetLookAt = new THREE.Vector3(0, EARTH_RADIUS + 32, 1000);
                targetFov = focalLengthToVerticalFov(GROUND_DEFAULT_FOCAL_LENGTH);
                groundLensSlider.value = String(GROUND_DEFAULT_FOCAL_LENGTH);
                updateLensDisplay(GROUND_DEFAULT_FOCAL_LENGTH, targetFov);
                targetEarthOpacity = 0;
                targetGroundOpacity = 0.98;
                targetGridOpacity = 0.58;
                dragModeSelect.value = 'look';
            } else if (name === 'overview') {
                targetPosition = new THREE.Vector3(OVERVIEW_DISTANCE, OVERVIEW_DISTANCE * 0.65, OVERVIEW_DISTANCE);
                targetLookAt = new THREE.Vector3(0, 0, 0);
                targetFov = 55;
                targetEarthOpacity = 0.5;
                targetGroundOpacity = 0.28;
                targetGridOpacity = 0;
                dragModeSelect.value = 'orbit';
            } else {
                targetPosition = new THREE.Vector3(0, 0, 0);
                targetLookAt = northStarPosition.clone();
                targetFov = 75;
                targetEarthOpacity = 0.22;
                targetGroundOpacity = 0.05;
                targetGridOpacity = 0;
                dragModeSelect.value = 'look';
            }

            setActiveViewPreset(name);
            startCameraTransition(
                targetPosition,
                targetLookAt,
                targetFov,
                targetEarthOpacity,
                targetGroundOpacity,
                targetGridOpacity,
                viewTransitionDuration
            );
        }

        function focusCameraOnConstellation(constellation) {
            const targetPosition = getConstellationCenter(constellation);
            if (!targetPosition) return;

            focusOnNorthStar = false;
            cameraFocusToggle.checked = false;
            dragModeSelect.value = 'look';
            clearActiveViewPreset();

            startCameraLookAtAnimation(targetPosition);
        }

        function getConstellationCenter(constellation) {
            const positions = starPositionLists[constellation];
            if (!positions || positions.length === 0) return null;

            const center = new THREE.Vector3();
            positions.forEach(position => center.add(position));
            center.divideScalar(positions.length);

            if (center.lengthSq() < 0.0001) center.copy(positions[0]);
            return center.normalize().multiplyScalar(SKY_RADIUS);
        }

        function startCameraLookAtAnimation(targetPosition) {
            const endQuaternion = getLookAtQuaternion(camera.position, targetPosition);
            cameraAnimation = {
                type: 'look',
                startTime: performance.now(),
                duration: cameraFocusDuration,
                startPosition: camera.position.clone(),
                endPosition: camera.position.clone(),
                startQuaternion: camera.quaternion.clone(),
                endQuaternion,
                startFov: camera.fov,
                endFov: camera.fov,
                startEarthOpacity: earthMaterial.opacity,
                endEarthOpacity: earthMaterial.opacity,
                startGroundOpacity: groundMaterial.opacity,
                endGroundOpacity: groundMaterial.opacity,
                startGridOpacity: groundGridMaterial.opacity,
                endGridOpacity: groundGridMaterial.opacity
            };
        }

        function startCameraTransition(
            targetPosition,
            targetLookAt,
            targetFov,
            targetEarthOpacity,
            targetGroundOpacity,
            targetGridOpacity,
            duration
        ) {
            cameraAnimation = {
                type: 'transition',
                startTime: performance.now(),
                duration,
                startPosition: camera.position.clone(),
                endPosition: targetPosition.clone(),
                startQuaternion: camera.quaternion.clone(),
                endQuaternion: getLookAtQuaternion(targetPosition, targetLookAt),
                startFov: camera.fov,
                endFov: targetFov,
                startEarthOpacity: earthMaterial.opacity,
                endEarthOpacity: targetEarthOpacity,
                startGroundOpacity: groundMaterial.opacity,
                endGroundOpacity: targetGroundOpacity,
                startGridOpacity: groundGridMaterial.opacity,
                endGridOpacity: targetGridOpacity
            };
        }

        function getLookAtQuaternion(cameraPosition, targetPosition) {
            // Cameraはローカルの -Z 方向を正面として見る。
            // 汎用Object3Dではなく、実際のCameraを使って「カメラ用のlookAt姿勢」を作る。
            const dummyCamera = new THREE.PerspectiveCamera(
                camera.fov,
                camera.aspect,
                camera.near,
                camera.far
            );
            dummyCamera.position.copy(cameraPosition);
            dummyCamera.up.copy(camera.up);
            dummyCamera.lookAt(targetPosition);
            dummyCamera.updateMatrixWorld();
            return dummyCamera.quaternion.clone();
        }

        function updateCameraAnimation(currentTime) {
            if (!cameraAnimation) return;

            const rawT = (currentTime - cameraAnimation.startTime) / cameraAnimation.duration;
            const t = Math.min(Math.max(rawT, 0), 1);
            const easedT = easeInOutCubic(t);

            camera.position.lerpVectors(
                cameraAnimation.startPosition,
                cameraAnimation.endPosition,
                easedT
            );
            camera.quaternion.slerpQuaternions(
                cameraAnimation.startQuaternion,
                cameraAnimation.endQuaternion,
                easedT
            );
            camera.fov = THREE.MathUtils.lerp(cameraAnimation.startFov, cameraAnimation.endFov, easedT);
            camera.updateProjectionMatrix();
            const animatedFocalLength = verticalFovToFocalLength(camera.fov);
            if (animatedFocalLength >= GROUND_MIN_FOCAL_LENGTH && animatedFocalLength <= GROUND_DEFAULT_FOCAL_LENGTH) {
                groundLensSlider.value = String(animatedFocalLength);
                updateLensDisplay(animatedFocalLength, camera.fov);
            }
            earthMaterial.opacity = THREE.MathUtils.lerp(
                cameraAnimation.startEarthOpacity,
                cameraAnimation.endEarthOpacity,
                easedT
            );
            groundMaterial.opacity = THREE.MathUtils.lerp(
                cameraAnimation.startGroundOpacity,
                cameraAnimation.endGroundOpacity,
                easedT
            );
            groundGridMaterial.opacity = THREE.MathUtils.lerp(
                cameraAnimation.startGridOpacity,
                cameraAnimation.endGridOpacity,
                easedT
            );

            if (t >= 1) {
                cameraAnimation = null;
                if (currentViewMode === 'ground') {
                    applyGroundCameraOrientation();
                } else {
                    syncCameraQuaternion();
                }
            }
        }

        function easeInOutCubic(t) {
            return t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate(currentTime) {
            requestAnimationFrame(animate);
            updateCameraAnimation(currentTime);
            updateConstellationLabels();
            renderer.render(scene, camera);
        }

        setCameraFocalLength(GROUND_DEFAULT_FOCAL_LENGTH);
        backgroundMagnitudeValue.textContent = `${parseFloat(backgroundMagnitudeSlider.value).toFixed(1)}等`;
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function convertToCartesian(ra, dec) {
            const radius = SKY_RADIUS;
            const phi = (90 - dec) * (Math.PI / 180);
            const theta = ra * (Math.PI / 180);
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            return new THREE.Vector3(x, y, z);
        }

        function colorFromBV(colorIndex) {
            if (!Number.isFinite(colorIndex)) return new THREE.Color(0xdde8ff);
            const ci = THREE.MathUtils.clamp(colorIndex, -0.4, 2.0);
            if (ci < 0) return new THREE.Color().lerpColors(new THREE.Color(0xaecbff), new THREE.Color(0xffffff), (ci + 0.4) / 0.4);
            if (ci < 0.8) return new THREE.Color().lerpColors(new THREE.Color(0xffffff), new THREE.Color(0xffefcf), ci / 0.8);
            return new THREE.Color().lerpColors(new THREE.Color(0xffefcf), new THREE.Color(0xffad72), (ci - 0.8) / 1.2);
        }

        function clearBackgroundStarLayers() {
            backgroundStarLayers.forEach(points => {
                backgroundStarGroup.remove(points);
                points.geometry.dispose();
                points.material.dispose();
            });
            backgroundStarLayers = [];
        }

        function buildBackgroundStarLayers(limitMagnitude) {
            clearBackgroundStarLayers();
            const bands = [
                { min: -2, max: 3.5, size: 1.7, opacity: 0.78 },
                { min: 3.5, max: 5.0, size: 1.25, opacity: 0.58 },
                { min: 5.0, max: 6.01, size: 0.9, opacity: 0.38 }
            ];

            bands.forEach(band => {
                const positions = [];
                const colors = [];
                backgroundStars.forEach(star => {
                    const ra = star[1];
                    const dec = star[2];
                    const magnitude = star[3];
                    if (magnitude > limitMagnitude || magnitude < band.min || magnitude >= band.max) return;
                    const position = convertToCartesian(ra, dec);
                    positions.push(position.x, position.y, position.z);
                    const color = colorFromBV(star[4]);
                    colors.push(color.r, color.g, color.b);
                });
                if (positions.length === 0) return;

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                const material = new THREE.PointsMaterial({
                    size: band.size,
                    sizeAttenuation: false,
                    vertexColors: true,
                    transparent: true,
                    opacity: band.opacity,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                const points = new THREE.Points(geometry, material);
                points.frustumCulled = false;
                backgroundStarGroup.add(points);
                backgroundStarLayers.push(points);
            });
            backgroundStarGroup.visible = backgroundStarsToggle.checked;
        }

        function createStar(starName, position, constellation) {
            const starGeometry = new THREE.BufferGeometry();
            const vertices = [position.x, position.y, position.z];
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 2.5,
                sizeAttenuation: false
            });
            const star = new THREE.Points(starGeometry, starMaterial);
            starGroup.add(star);

            starPositions[starName] = position;
            if (!starMeshes[constellation]) {
                starMeshes[constellation] = [];
            }
            starMeshes[constellation].push(star);

            if (!starPositionLists[constellation]) {
                starPositionLists[constellation] = [];
            }
            starPositionLists[constellation].push(position.clone());

            // stars.jsで最初に登場する星を、その星座名ラベルのアンカーにする
            if (!constellationFirstStarPositions[constellation]) {
                constellationFirstStarPositions[constellation] = position.clone();
            }
        }

        function createConstellationLabel(constellation) {
            const label = document.createElement('div');
            label.className = 'constellation-label';
            label.textContent = constellation;
            constellationLabelsLayer.appendChild(label);
            constellationLabelElements[constellation] = label;
        }

        function updateConstellationLabels() {
            const cameraDirection = new THREE.Vector3();
            camera.getWorldDirection(cameraDirection);

            Object.keys(constellationLabelElements).forEach(constellation => {
                const label = constellationLabelElements[constellation];
                const anchorPosition = constellationFirstStarPositions[constellation];

                if (!anchorPosition) {
                    label.style.display = 'none';
                    return;
                }

                const toAnchor = anchorPosition.clone().sub(camera.position);
                const isInFront = cameraDirection.dot(toAnchor) > 0;
                const projected = anchorPosition.clone().project(camera);
                const isInsideDepth = projected.z >= -1 && projected.z <= 1;

                if (!isInFront || !isInsideDepth) {
                    label.style.display = 'none';
                    return;
                }

                const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;

                label.style.display = 'block';
                label.style.left = `${x}px`;
                label.style.top = `${y}px`;
            });
        }

        function createStarLine(starName1, starName2, constellation) {
            const pos1 = starPositions[starName1];
            const pos2 = starPositions[starName2];

            if (pos1 && pos2) {
                const lineGeometry = new THREE.BufferGeometry().setFromPoints([pos1, pos2]);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00 });
                const line = new THREE.Line(lineGeometry, lineMaterial);
                lineGroup.add(line);

                if (!lineMeshes[constellation]) {
                    lineMeshes[constellation] = [];
                }
                lineMeshes[constellation].push(line);
            } else {
                console.warn(`星が見つかりません: ${starName1}, ${starName2}`);
            }
        }

        // stars.js と starline.js からデータを使って星座と線を作成する
        const constellations = new Set();

        stars.forEach(star => {
            const ra = (parseFloat(star.raHour) + parseFloat(star.raMin) / 60 + parseFloat(star.raSec) / 3600) * 15;
            const dec = (star.decSign === '-' ? -1 : 1) * (parseFloat(star.decDeg) + parseFloat(star.decMin) / 60 + parseFloat(star.decSec) / 3600);
            const position = convertToCartesian(ra, dec);
            createStar(star.starName, position, star.constellation);
            constellations.add(star.constellation);
        });

        buildBackgroundStarLayers(parseFloat(backgroundMagnitudeSlider.value));

        starlines.forEach(line => {
            createStarLine(line.starName1, line.starName2, line.constellation);
        });

        // 星座リストの作成
        constellations.forEach(constellation => {
            const option = document.createElement('option');
            option.value = constellation;
            option.textContent = constellation;
            constellationSelect.appendChild(option);
            createConstellationLabel(constellation);
        });

        constellationSelect.addEventListener('change', function() {
            const selectedConstellation = constellationSelect.value;

            Object.keys(constellationLabelElements).forEach(constellation => {
                constellationLabelElements[constellation].classList.toggle(
                    'selected',
                    constellation === selectedConstellation
                );
            });

            Object.keys(starMeshes).forEach(constellation => {
                starMeshes[constellation].forEach(star => {
                    star.material.color.set(0xffffff);
                    star.material.size = 2;
                });
            });

            Object.keys(lineMeshes).forEach(constellation => {
                lineMeshes[constellation].forEach(line => {
                    line.material.color.set(0x00ff00);
                    line.material.linewidth = 1;
                });
            });

            if (selectedConstellation) {
                if (starMeshes[selectedConstellation]) {
                    starMeshes[selectedConstellation].forEach(star => {
                        star.material.color.set(0xff0000);
                        star.material.size = 5;
                    });
                }

                if (lineMeshes[selectedConstellation]) {
                    lineMeshes[selectedConstellation].forEach(line => {
                        line.material.color.set(0xff0000);
                        line.material.linewidth = 3;
                    });
                }

                focusCameraOnConstellation(selectedConstellation);
            }
        });
    </script>
</body>
</html>
