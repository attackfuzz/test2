<!DOCTYPE html>
<!-- 星座表示 + 現行UIデザイン統合版 -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>星座探索 - 下段UI・時計・サイドシート試作</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        html,
        body {
            width: 100%;
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            position: fixed;
            inset: 0;
            margin: 0;
            overflow: hidden;
            background: #000011;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #controls {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            z-index: 100;
            width: min(380px, calc(100vw - 24px));
            max-height: calc(100vh - 24px - env(safe-area-inset-top));
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            user-select: auto;
            -webkit-user-select: auto;
            display: flex;
            flex-direction: column;
            gap: 9px;
            padding: 12px;
            border: 1px solid rgba(150, 190, 255, 0.18);
            border-radius: 13px;
            background: rgba(0, 0, 18, 0.83);
            color: #ffffff;
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.34);
        }
        #controls select,
        #controls button,
        #controls label,
        #controls input {
            font: inherit;
        }
        #controls select,
        #controls button,
        #controls input[type="datetime-local"],
        #controls input[type="number"] {
            min-height: 36px;
            padding: 7px 8px;
            border: 1px solid rgba(160, 190, 255, 0.28);
            border-radius: 7px;
            color: #ffffff;
            background: rgba(22, 29, 57, 0.92);
        }
        #controls button {
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 80ms ease, background-color 100ms ease, border-color 100ms ease, filter 100ms ease;
        }
        #controls button:focus-visible {
            outline: 3px solid rgba(119, 187, 255, 0.92);
            outline-offset: 2px;
        }
        #controls button.is-pressed,
        #controls button:active {
            transform: scale(0.97);
            filter: brightness(1.24);
            border-color: rgba(160, 210, 255, 0.78);
        }
        #controls button:disabled {
            cursor: default;
            opacity: 0.5;
            transform: none;
            filter: none;
        }
        #controls select,
        #controls input,
        #controls label {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .controls-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 36px;
        }
        .controls-title {
            font-size: 14px;
            font-weight: 750;
            letter-spacing: 0.05em;
            color: #cde4ff;
        }
        #controlsToggle {
            min-width: 92px;
            padding-inline: 9px;
            font-size: 12px;
        }
        #controls.collapsed {
            width: auto;
            max-height: none;
            overflow: hidden;
            padding: 8px 9px;
        }
        #controls.collapsed > :not(.controls-header) {
            display: none !important;
        }
        #constellationSelect { width: 100%; }
        .control-row {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
        }
        .view-mode-row {
            display: grid;
            grid-template-columns: 62px repeat(3, minmax(0, 1fr));
            gap: 7px;
        }
        .control-row > .row-label {
            min-width: 62px;
            opacity: 0.78;
            font-size: 13px;
        }
        .view-button {
            flex: 1;
            min-width: 78px;
        }
        .view-button.active {
            outline: 2px solid #77bbff;
            background: #dceeff !important;
            color: #071222 !important;
        }
        .section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            border: 1px solid rgba(130, 170, 235, 0.15);
            border-radius: 10px;
            background: rgba(13, 20, 44, 0.62);
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #a8cfff;
        }
        .ground-only,
        .center-only {
            display: none;
        }
        .ground-only.visible,
        .center-only.visible {
            display: flex;
        }
        .stack-row {
            display: grid;
            grid-template-columns: 72px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
        }
        .stack-row > label,
        .stack-row > span:first-child {
            font-size: 12px;
            opacity: 0.78;
        }
        .coordinate-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }
        .coordinate-field {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 5px;
            align-items: center;
        }
        .coordinate-field span {
            font-size: 12px;
            opacity: 0.75;
        }
        .time-step-row,
        .play-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
        }
        .play-row {
            grid-template-columns: minmax(88px, 1fr) minmax(112px, 1fr);
        }
        .time-step-row button,
        .play-row button,
        .play-row select {
            min-width: 0;
            padding-left: 4px;
            padding-right: 4px;
        }
        .check-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 6px 4px;
            cursor: pointer;
        }
        .check-label input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin: 0;
            flex: 0 0 auto;
        }
        #controls input[type="range"] {
            min-height: 40px;
            margin: 0;
            touch-action: pan-y;
        }
        #controls input[type="range"]::-webkit-slider-thumb {
            width: 26px;
            height: 26px;
        }
        #controls input[type="range"]::-moz-range-thumb {
            width: 26px;
            height: 26px;
        }
        .lens-control,
        .background-control {
            display: grid;
            grid-template-columns: auto minmax(120px, 1fr) auto;
            align-items: center;
            gap: 8px;
        }
        .lens-control input[type="range"],
        .background-control input[type="range"] {
            width: 100%;
            padding: 0;
        }
        #lensValue,
        #backgroundMagnitudeValue {
            min-width: 78px;
            text-align: right;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }
        #backgroundMagnitudeValue { min-width: 42px; }
        #skyStatus {
            padding: 8px;
            border-radius: 8px;
            background: rgba(3, 8, 24, 0.72);
            font-size: 12px;
            line-height: 1.5;
            font-variant-numeric: tabular-nums;
        }
        #touchHint {
            position: fixed;
            left: 50%;
            bottom: max(14px, env(safe-area-inset-bottom));
            z-index: 90;
            display: none;
            transform: translateX(-50%);
            max-width: calc(100vw - 28px);
            padding: 8px 12px;
            border: 1px solid rgba(160, 195, 255, 0.22);
            border-radius: 999px;
            background: rgba(2, 8, 24, 0.75);
            color: rgba(255, 255, 255, 0.86);
            font-size: 12px;
            line-height: 1.35;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            backdrop-filter: blur(6px);
            transition: opacity 220ms ease;
        }
        #touchHint.dismissed {
            opacity: 0;
        }
        #controlHint,
        .small-note {
            font-size: 11px;
            opacity: 0.66;
            line-height: 1.45;
        }
        #constellationLabels {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            overflow: hidden;
        }
        .constellation-label {
            position: absolute;
            transform: translate(-50%, calc(-100% - 10px));
            padding: 3px 7px;
            border-radius: 4px;
            background: rgba(0, 0, 20, 0.68);
            color: #ffffff;
            font-size: 13px;
            line-height: 1.2;
            white-space: nowrap;
            text-shadow: 0 1px 2px #000000;
            opacity: 0.82;
        }
        .constellation-label.selected {
            color: #ff7777;
            font-weight: bold;
            opacity: 1;
        }
        @media (hover: none) and (pointer: coarse) {
            #controls select,
            #controls button,
            #controls input[type="datetime-local"],
            #controls input[type="number"] {
                min-height: 48px;
                font-size: 16px;
            }
            #controls button {
                padding: 10px 12px;
            }
            #controlsToggle {
                min-width: 104px;
            }
            .view-button,
            .time-step-row button,
            .play-row button {
                font-weight: 700;
            }
            .check-label {
                min-height: 48px;
            }
            #controls input[type="range"] {
                min-height: 48px;
            }
            #controls input[type="range"]::-webkit-slider-thumb {
                width: 30px;
                height: 30px;
            }
            #controls input[type="range"]::-moz-range-thumb {
                width: 30px;
                height: 30px;
            }
            #touchHint {
                display: block;
            }
        }
        @media (max-width: 520px) {
            #controls {
                top: max(8px, env(safe-area-inset-top));
                left: 8px;
                width: calc(100vw - 16px);
                max-height: calc(100dvh - 16px - env(safe-area-inset-top));
                padding: 10px;
            }
            #controls.collapsed {
                width: auto;
                max-width: calc(100vw - 16px);
            }
            .view-mode-row {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .view-mode-row > .row-label {
                grid-column: 1 / -1;
                min-width: 0;
            }
            .time-step-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .play-row {
                grid-template-columns: 1fr 1fr;
            }
            #controlHint {
                display: none;
            }
        }


        /* --- 下段UI + 時計展開 + 設定サイドシート試作 --- */
        #controls {
            position: fixed !important;
            top: 0 !important;
            right: 0 !important;
            left: auto !important;
            bottom: 0;
            z-index: 220;
            width: min(390px, 88vw) !important;
            max-height: 100dvh !important;
            height: 100dvh;
            padding: max(16px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
            border: 0;
            border-left: 1px solid rgba(160, 195, 255, 0.20);
            border-radius: 0;
            background: rgba(3, 9, 27, 0.96);
            transform: translateX(104%);
            transition: transform 340ms cubic-bezier(.2,.82,.2,1);
            box-shadow: -16px 0 44px rgba(0,0,0,0.45);
        }
        #controls.open { transform: translateX(0); }
        #controls .controls-header { display: none !important; }
        #controls.collapsed { width: min(390px, 88vw) !important; max-height: 100dvh !important; padding: max(16px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)); }
        #controls.collapsed > :not(.controls-header) { display: flex !important; }
        #controls.collapsed > select { display: block !important; }
        #controls.collapsed > .view-mode-row { display: grid !important; }
        #settingsScrim {
            position: fixed;
            inset: 0;
            z-index: 210;
            background: rgba(0,0,0,0.38);
            opacity: 0;
            pointer-events: none;
            transition: opacity 240ms ease;
        }
        #settingsScrim.open { opacity: 1; pointer-events: auto; }
        #sideSheetHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 2px;
            padding: 4px 2px 8px;
        }
        #sideSheetHeader strong { color: #d9ebff; letter-spacing: .05em; }
        #sideSheetClose {
            min-height: 42px;
            min-width: 64px;
            border: 1px solid rgba(160,195,255,.28);
            border-radius: 10px;
            background: rgba(24,34,68,.95);
            color: #fff;
            font: inherit;
        }

        #bottomDock {
            position: fixed;
            left: 50%;
            bottom: max(8px, env(safe-area-inset-bottom));
            z-index: 155;
            transform: translateX(-50%);
            width: min(470px, calc(100vw - 16px));
            padding: 8px;
            border: 1px solid rgba(150,190,255,.20);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(7,15,38,.79), rgba(2,7,22,.91));
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 34px rgba(0,0,0,.38);
        }
        .dock-row { display: grid; gap: 7px; }
        .dock-row + .dock-row { margin-top: 7px; }
        .dock-top { grid-template-columns: 1fr 1.18fr 1fr; }
        .dock-middle { grid-template-columns: 1fr 1.08fr 1fr; }
        .dock-bottom { grid-template-columns: .82fr 1.45fr; }
        #bottomDock button {
            min-height: 46px;
            padding: 7px 8px;
            border: 1px solid rgba(160,195,255,.25);
            border-radius: 12px;
            color: #fff;
            background: rgba(23,34,67,.86);
            font: inherit;
            font-weight: 720;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #bottomDock button:active { transform: scale(.97); filter: brightness(1.18); }
        #clockToggleButton {
            position: relative;
            background: rgba(7,17,42,.92) !important;
            font-variant-numeric: tabular-nums;
            font-size: 18px !important;
            letter-spacing: .04em;
        }
        #clockToggleButton::after {
            content: '⌃';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-52%);
            font-size: 12px;
            opacity: .62;
            transition: transform 260ms ease;
        }
        #clockToggleButton[aria-expanded="true"]::after { transform: translateY(-40%) rotate(180deg); }
        #settingsButton { font-size: 19px !important; }
        #infoToggleButton { background: rgba(50,74,120,.93) !important; }

        #clockPanel {
            position: fixed;
            left: 50%;
            bottom: calc(max(8px, env(safe-area-inset-bottom)) + 166px);
            z-index: 150;
            width: min(300px, 72vw);
            aspect-ratio: 1 / 1;
            transform: translate(-50%, 24px) scale(.78);
            transform-origin: 50% 100%;
            opacity: 0;
            pointer-events: none;
            transition: transform 330ms cubic-bezier(.18,.86,.24,1), opacity 220ms ease;
        }
        #clockPanel.open {
            transform: translate(-50%, 0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .clock-face {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,15,38,.32) 0%, rgba(3,10,29,.54) 55%, rgba(1,5,18,.10) 72%, transparent 73%);
            filter: drop-shadow(0 9px 22px rgba(0,0,0,.34));
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
        }
        .clock-face.dragging {
            cursor: grabbing;
        }
        .clock-face.dragging #clockHandWrap {
            transition: none;
        }
        .clock-number {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 48px;
            height: 48px;
            margin: -24px;
            border: 0;
            border-radius: 50%;
            background: rgba(4,10,28,.55);
            color: rgba(239,247,255,.95);
            font: 750 19px/1 system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transform: rotate(var(--a)) translateY(-122px) rotate(calc(-1 * var(--a)));
            text-shadow: 0 1px 6px #000;
            transition: background 120ms ease, color 120ms ease, scale 120ms ease;
        }
        .clock-number:active { scale: .92; background: rgba(81,122,189,.72); }
        .clock-number.selected { background: rgba(94,145,220,.72); color: #fff; }
        #clockHandWrap {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 4px;
            height: 4px;
            transform: translate(-50%,-50%) rotate(0deg);
            transition: transform 300ms cubic-bezier(.18,.9,.23,1.15);
            pointer-events: none;
        }
        #clockHand {
            position: absolute;
            left: -16px;
            bottom: 2px;
            width: 32px;
            height: 84px;
            clip-path: polygon(50% 0, 94% 92%, 50% 74%, 6% 92%);
            background: linear-gradient(180deg, rgba(225,242,255,.98), rgba(91,157,229,.82));
            filter: drop-shadow(0 2px 7px rgba(50,130,230,.55));
            transform-origin: 50% 100%;
        }
        #clockCenter {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 9px;
            height: 9px;
            transform: translate(-50%,-50%);
            border-radius: 50%;
            background: #d8edff;
            box-shadow: 0 0 12px rgba(105,177,255,.75);
            pointer-events: none;
        }
        #clockPreview {
            position: absolute;
            left: 50%;
            bottom: 13%;
            transform: translateX(-50%);
            min-width: 88px;
            text-align: center;
            color: rgba(205,229,255,.82);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }

        #infoSheet {
            position: fixed;
            left: 50%;
            bottom: calc(max(8px, env(safe-area-inset-bottom)) + 166px);
            z-index: 180;
            width: min(520px, calc(100vw - 16px));
            max-height: min(44dvh, 380px);
            overflow: hidden;
            transform: translate(-50%, calc(100% + 180px));
            opacity: 0;
            pointer-events: none;
            transition: transform 330ms cubic-bezier(.2,.82,.2,1), opacity 220ms ease;
            border: 1px solid rgba(160,195,255,.22);
            border-radius: 18px 18px 14px 14px;
            background: rgba(3,9,27,.95);
            color: #fff;
            backdrop-filter: blur(13px);
            box-shadow: 0 -12px 36px rgba(0,0,0,.42);
        }
        #infoSheet.open { transform: translate(-50%,0); opacity: 1; pointer-events: auto; }
        .info-sheet-handle { width:46px; height:5px; margin:9px auto 2px; border-radius:999px; background:rgba(190,215,255,.42); }
        .info-sheet-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 14px 10px; border-bottom:1px solid rgba(150,190,255,.13); }
        #infoSheetTitle { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:16px; font-weight:800; color:#d9ebff; }
        #infoSheetClose { min-width:62px; min-height:40px; padding:6px 10px; border:1px solid rgba(160,195,255,.3); border-radius:10px; color:#fff; background:rgba(24,34,68,.95); font:inherit; }
        .info-sheet-body { overflow-y:auto; max-height:calc(min(44dvh,380px) - 92px); padding:14px 16px 18px; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
        #infoSheetText { margin:0; font-size:14px; line-height:1.75; color:rgba(255,255,255,.88); user-select:text; -webkit-user-select:text; }
        .info-sheet-note { margin-top:12px; font-size:11px; line-height:1.5; color:rgba(190,210,240,.60); }

        #touchHint { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 170px); }
        @media (max-width: 520px) {
            #controls { width: 90vw !important; }
            #bottomDock { width: calc(100vw - 14px); padding: 7px; }
            #bottomDock button { min-height: 44px; font-size: 13px; }
            #clockToggleButton { font-size: 17px !important; }
            #clockPanel { width: min(284px, 76vw); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 160px); }
            .clock-number { transform: rotate(var(--a)) translateY(-112px) rotate(calc(-1 * var(--a))); }
            #infoSheet { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 160px); }
        }

    
        /* Clock/date consolidated dock */
        .dock-top {
            grid-template-columns: 1fr !important;
            justify-items: center;
        }

        #clockToggleButton.clock-summary {
            min-width: 132px;
            padding: 7px 14px 8px;
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            gap: 2px;
            background: rgba(10,18,42,.72);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
        }
        #clockToggleButton .clock-summary-time {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.05;
        }
        #clockToggleButton .clock-summary-date {
            font-size: 11px;
            opacity: .72;
            line-height: 1;
        }

        .dock-middle {
            max-height: 0;
            opacity: 0;
            overflow: visible;
            transform: translateY(8px);
            pointer-events: none;
            transition:
                max-height 240ms ease,
                opacity 180ms ease,
                transform 240ms cubic-bezier(.2,.8,.2,1);
        }
        .dock-middle.clock-open {
            max-height: 64px;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .quick-now-wrap {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0,1fr) 42px;
            gap: 4px;
        }
        #quickNowMenuButton {
            min-width: 42px;
            padding-inline: 0 !important;
        }
        #quickNowMenu {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 8px);
            transform: translate(-50%, 8px);
            width: min(210px, 72vw);
            padding: 8px;
            border-radius: 14px;
            background: rgba(5,11,27,.97);
            border: 1px solid rgba(255,255,255,.14);
            box-shadow: 0 16px 36px rgba(0,0,0,.42);
            opacity: 0;
            pointer-events: none;
            transition: opacity 160ms ease, transform 180ms ease;
            z-index: 90;
        }
        #quickNowMenu.open {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }
        #quickNowMenu button {
            width: 100%;
            min-height: 42px;
            margin: 3px 0;
            text-align: left;
        }

        /* clock preview text is no longer needed */
        #clockPreview { display: none !important; }

    
        .clock-ampm-label {
            margin-left: 4px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .08em;
            opacity: .82;
            vertical-align: 2px;
        }

        #clockDayRow {
            grid-template-columns: 1fr 1fr 1fr !important;

        /* ===== Compact always-visible clock redesign ===== */

    <script>
    (() => {
        const button = document.getElementById('settingsButton');
        const sheet = document.getElementById('settingsSheetV2');
        const close = document.getElementById('settingsCloseV2');
        const scrim = document.getElementById('settingsScrimV2');
        const modeButtons = Array.from(document.querySelectorAll('.settingsV2ModeButton'));

        const v2LocationPreset = document.getElementById('v2LocationPreset');
        const v2LatitudeInput = document.getElementById('v2LatitudeInput');
        const v2LongitudeInput = document.getElementById('v2LongitudeInput');
        const v2TimeZoneSelect = document.getElementById('v2TimeZoneSelect');
        const v2ObservationDateTime = document.getElementById('v2ObservationDateTime');
        const v2NowButton = document.getElementById('v2NowButton');
        const v2TimeStepButtons = Array.from(document.querySelectorAll('[data-v2-time-step]'));
        const v2LocationStatus = document.getElementById('v2LocationStatus');
        const v2TimeStatus = document.getElementById('v2TimeStatus');

        function oldControl(id) {
            return document.getElementById(id);
        }

        function cloneOptions(source, target) {
            if (!source || !target || target.options.length) return;
            target.innerHTML = source.innerHTML;
        }

        function dispatchChange(element) {
            if (!element) return;
            element.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function clickOld(element) {
            if (!element) return;
            element.click();
        }

        function setModeActive(mode) {
            modeButtons.forEach(modeButton => {
                const active = modeButton.dataset.viewMode === mode;
                modeButton.classList.toggle('active', active);
                modeButton.setAttribute('aria-pressed', String(active));
            });
        }

        function syncModeFromViewer() {
            try {
                if (typeof currentViewMode !== 'undefined') {
                    setModeActive(currentViewMode);
                }
            } catch (_) {}
        }

        function syncLocationTimeFromViewer() {
            const locationPreset = oldControl('locationPreset');
            const latitudeInput = oldControl('latitudeInput');
            const longitudeInput = oldControl('longitudeInput');
            const timeZoneSelect = oldControl('timeZoneSelect');
            const observationDateTime = oldControl('observationDateTime');

            cloneOptions(locationPreset, v2LocationPreset);
            cloneOptions(timeZoneSelect, v2TimeZoneSelect);

            if (locationPreset) v2LocationPreset.value = locationPreset.value;
            if (latitudeInput) v2LatitudeInput.value = latitudeInput.value;
            if (longitudeInput) v2LongitudeInput.value = longitudeInput.value;
            if (timeZoneSelect) v2TimeZoneSelect.value = timeZoneSelect.value;
            if (observationDateTime) v2ObservationDateTime.value = observationDateTime.value;

            if (v2LocationStatus && v2LatitudeInput.value && v2LongitudeInput.value) {
                v2LocationStatus.textContent =
                    `緯度 ${v2LatitudeInput.value}° / 経度 ${v2LongitudeInput.value}°`;
            }

            if (v2TimeStatus && v2ObservationDateTime.value) {
                v2TimeStatus.textContent = `観測日時: ${v2ObservationDateTime.value.replace('T', ' ')}`;
            }
        }

        function setOpen(open) {
            sheet.classList.toggle('open', open);
            scrim.classList.toggle('open', open);
            sheet.setAttribute('aria-hidden', String(!open));
            scrim.setAttribute('aria-hidden', String(!open));
            button.setAttribute('aria-expanded', String(open));

            if (open) {
                requestAnimationFrame(() => {
                    syncModeFromViewer();
                    syncLocationTimeFromViewer();
                });
            }
        }

        button.addEventListener('click', () => setOpen(!sheet.classList.contains('open')));
        close.addEventListener('click', () => setOpen(false));
        scrim.addEventListener('click', () => setOpen(false));

        modeButtons.forEach(modeButton => {
            modeButton.addEventListener('click', () => {
                const mode = modeButton.dataset.viewMode;
                if (typeof applyViewPreset === 'function') {
                    applyViewPreset(mode, true);
                    setModeActive(mode);
                }
            });
        });

        v2LocationPreset.addEventListener('change', () => {
            const old = oldControl('locationPreset');
            if (!old) return;
            old.value = v2LocationPreset.value;
            dispatchChange(old);
            requestAnimationFrame(syncLocationTimeFromViewer);
        });

        function applyV2Coordinates() {
            const oldLat = oldControl('latitudeInput');
            const oldLon = oldControl('longitudeInput');
            if (!oldLat || !oldLon) return;

            oldLat.value = v2LatitudeInput.value;
            oldLon.value = v2LongitudeInput.value;

            // 既存ビューアでは各changeで同じ custom 座標適用関数が呼ばれる。
            dispatchChange(oldLat);
            dispatchChange(oldLon);
            requestAnimationFrame(syncLocationTimeFromViewer);
        }

        v2LatitudeInput.addEventListener('change', applyV2Coordinates);
        v2LongitudeInput.addEventListener('change', applyV2Coordinates);

        v2TimeZoneSelect.addEventListener('change', () => {
            const old = oldControl('timeZoneSelect');
            if (!old) return;
            old.value = v2TimeZoneSelect.value;
            dispatchChange(old);
            requestAnimationFrame(syncLocationTimeFromViewer);
        });

        v2ObservationDateTime.addEventListener('change', () => {
            const old = oldControl('observationDateTime');
            if (!old) return;
            old.value = v2ObservationDateTime.value;
            dispatchChange(old);
            requestAnimationFrame(syncLocationTimeFromViewer);
        });

        v2NowButton.addEventListener('click', () => {
            clickOld(oldControl('nowButton'));
            requestAnimationFrame(() => {
                requestAnimationFrame(syncLocationTimeFromViewer);
            });
        });

        v2TimeStepButtons.forEach(stepButton => {
            stepButton.addEventListener('click', () => {
                const value = stepButton.dataset.v2TimeStep;
                const oldButton = document.querySelector(`[data-time-step="${value}"]`);
                clickOld(oldButton);
                requestAnimationFrame(() => {
                    requestAnimationFrame(syncLocationTimeFromViewer);
                });
            });
        });

        // 旧UI側が時計やプリセットから更新された場合も、次回サイドシート表示時に同期。
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') setOpen(false);
        });
    })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        'use strict';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(27, window.innerWidth / window.innerHeight, 0.5, 250000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000011);
        document.body.appendChild(renderer.domElement);

        const EARTH_RADIUS = 1000;
        const OBSERVER_HEIGHT = 1.7;
        const SKY_RADIUS = 100000;
        const OVERVIEW_DISTANCE = EARTH_RADIUS * 3;
        const FULL_FRAME_SENSOR_HEIGHT = 24;
        const GROUND_DEFAULT_FOCAL_LENGTH = 50;
        const GROUND_MIN_FOCAL_LENGTH = 6;
        const GROUND_MIN_ALTITUDE = THREE.MathUtils.degToRad(-5);
        const GROUND_MAX_ALTITUDE = THREE.MathUtils.degToRad(89);
        const ROTATION_SPEED = 0.0065;
        const ORBIT_SPEED = 0.0065;
        const VIEW_TRANSITION_DURATION = 900;
        const CAMERA_FOCUS_DURATION = 700;

        const LOCATION_PRESETS = {
            tokyo:     { name: '東京', lat: 35.681236, lon: 139.767125, zone: 'Asia/Tokyo' },
            sapporo:   { name: '札幌', lat: 43.062096, lon: 141.354376, zone: 'Asia/Tokyo' },
            naha:      { name: '那覇', lat: 26.212401, lon: 127.680932, zone: 'Asia/Tokyo' },
            osaka:     { name: '大阪', lat: 34.693738, lon: 135.502165, zone: 'Asia/Tokyo' },
            london:    { name: 'ロンドン', lat: 51.5074, lon: -0.1278, zone: 'Europe/London' },
            newyork:   { name: 'ニューヨーク', lat: 40.7128, lon: -74.0060, zone: 'America/New_York' },
            sydney:    { name: 'シドニー', lat: -33.8688, lon: 151.2093, zone: 'Australia/Sydney' },
            equator:   { name: '赤道・経度0°', lat: 0, lon: 0, zone: 'Etc/UTC' },
            northpole: { name: '北極', lat: 90, lon: 0, zone: 'Etc/UTC' },
            southpole: { name: '南極', lat: -90, lon: 0, zone: 'Etc/UTC' }
        };

        const earthGroup = new THREE.Group();
        const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 96, 64);

        const groundMaterial = new THREE.MeshBasicMaterial({
            color: 0x07180d,
            opacity: 0.05,
            transparent: true,
            depthWrite: false,
            side: THREE.FrontSide
        });
        const groundEarth = new THREE.Mesh(earthGeometry, groundMaterial);
        earthGroup.add(groundEarth);

        // 地上モード専用の不可視深度マスク。
        // 星座線を地平線位置で切断せず、地球の裏側にある線や星を深度で隠す。
        const groundDepthMaterial = new THREE.MeshBasicMaterial({
            colorWrite: false,
            depthWrite: true,
            depthTest: true,
            side: THREE.FrontSide
        });
        const groundDepthOccluder = new THREE.Mesh(earthGeometry, groundDepthMaterial);
        groundDepthOccluder.visible = false;
        groundDepthOccluder.renderOrder = -10;
        earthGroup.add(groundDepthOccluder);

        const earthMaterial = new THREE.MeshBasicMaterial({
            color: 0x168a42,
            wireframe: true,
            opacity: 0,
            transparent: true,
            depthWrite: false
        });
        const earthWireframe = new THREE.Mesh(earthGeometry, earthMaterial);
        earthWireframe.scale.setScalar(1.002);
        earthGroup.add(earthWireframe);
        scene.add(earthGroup);


        // 地上モードでは地面グリッドを使用しない。


        const celestialGroup = new THREE.Group();
        const backgroundStarGroup = new THREE.Group();
        const starGroup = new THREE.Group();
        const lineGroup = new THREE.Group();
        celestialGroup.add(backgroundStarGroup, starGroup, lineGroup);
        scene.add(celestialGroup);

        function getClockAngleFromPointer(event) {
            const rect = clockFace.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = event.clientX - centerX;
            const dy = event.clientY - centerY;

            // 12時 = 0度、時計回りが正方向
            let angle = Math.atan2(dx, -dy) * 180 / Math.PI;
            if (angle < 0) angle += 360;
            return angle;
        }

        function shortestClockAngleDelta(currentDeg, previousDeg) {
            let delta = currentDeg - previousDeg;
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            return delta;
        }

        function updateClockHandFromSimulation() {
            const parts = getZonedParts(
                new Date(simulationUtcMs),
                timeZoneSelect.value

            const minute12h = (parts.hour % 12) * 60 + parts.minute;
            const angle = minute12h * 0.5;

                `translate(-50%,-50%) rotate(${angle}deg)`;
        }

        function handleClockPointerDown(event) {
            if (!clockPanel.classList.contains('open')) return;
            if (clockDragPointerId !== null) return;

            event.preventDefault();
            event.stopPropagation();

            clockDragPointerId = event.pointerId;
            clockTapStartX = event.clientX;
            clockTapStartY = event.clientY;
            clockDragLastAngleDeg = getClockAngleFromPointer(event);
            clockDragAccumulatedMinutes = 0;
            clockDragStartSimulationUtcMs = simulationUtcMs;
            clockDragHasMoved = false;
            clockFace.classList.add('dragging');

            try {
                clockFace.setPointerCapture(event.pointerId);
            } catch (_) {}
        }

        function handleClockPointerMove(event) {
            if (event.pointerId !== clockDragPointerId) return;

            event.preventDefault();
            event.stopPropagation();

            const currentAngleDeg = getClockAngleFromPointer(event);
            const deltaDeg = shortestClockAngleDelta(
                currentAngleDeg,
                clockDragLastAngleDeg
            );

            clockDragLastAngleDeg = currentAngleDeg;

            // 30度 = 1時間、1度 = 2分。
            clockDragAccumulatedMinutes += deltaDeg * 2;

            // 5分刻みにスナップ。
            const snappedMinutes =
                Math.round(clockDragAccumulatedMinutes / 5) * 5;

            const dragDistance = Math.hypot(
                event.clientX - clockTapStartX,
                event.clientY - clockTapStartY
            );

            if (dragDistance >= 7 || Math.abs(snappedMinutes) >= 5) {
                clockDragHasMoved = true;
            }

            simulationUtcMs =
                clockDragStartSimulationUtcMs +
                snappedMinutes * 60 * 1000;

            pauseTimePlayback();
            updateObserverFromSimulation(true);
            updateClockHandFromSimulation();
        }

            clockDragPointerId = null;
            clockDragLastAngleDeg = null;
            clockDragAccumulatedMinutes = 0;

            updateClockHandFromSimulation();

            if (!clockDragHasMoved) {

        function bindTapAction(button, handler) {
            let activePointerId = null;
            let startX = 0;
            let startY = 0;
            let moved = false;
            let suppressNativeClickUntil = 0;
            const moveTolerance = 14;

            button.addEventListener('pointerdown', event => {
                if (event.pointerType === 'mouse') return;
                activePointerId = event.pointerId;
                startX = event.clientX;
                startY = event.clientY;
                moved = false;
                button.classList.add('is-pressed');
                try {
                    button.setPointerCapture(event.pointerId);
                } catch (_) {
                    // Pointer capture is optional on older mobile browsers.
                }
            }, { passive: true });

            button.addEventListener('pointermove', event => {
                if (event.pointerId !== activePointerId) return;
                if (Math.hypot(event.clientX - startX, event.clientY - startY) > moveTolerance) {
                    moved = true;
                    button.classList.remove('is-pressed');
                }
            }, { passive: true });

            button.addEventListener('pointerup', event => {
                if (event.pointerId !== activePointerId) return;
                const shouldActivate = !moved && !button.disabled;
                activePointerId = null;
                button.classList.remove('is-pressed');
                if (!shouldActivate) return;
                event.preventDefault();
                suppressNativeClickUntil = performance.now() + 700;
                handler(event);
            }, { passive: false });

            button.addEventListener('pointercancel', event => {
                if (event.pointerId !== activePointerId) return;
                activePointerId = null;
                moved = false;
                button.classList.remove('is-pressed');
            });

            button.addEventListener('lostpointercapture', () => {
                activePointerId = null;
                moved = false;
                button.classList.remove('is-pressed');
            });

            button.addEventListener('click', event => {
                if (performance.now() < suppressNativeClickUntil) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    return;
                }
                handler(event);
            });
        }

        function handleCanvasPointerDown(event) {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            event.preventDefault();
            dismissTouchHint();

            activePointers.set(event.pointerId, {
                x: event.clientX,
                y: event.clientY,
                pointerType: event.pointerType
            });

            try {
                renderer.domElement.setPointerCapture(event.pointerId);
            } catch (_) {
                // Some browsers may reject capture during a cancelled gesture.
            }

            if (activePointers.size === 1) {
                dragPointerId = event.pointerId;
                pinchStartDistance = null;
                beginPointerDrag(event.clientX, event.clientY);
                return;
            }

            if (activePointers.size >= 2) {
                isDragging = false;
                dragPointerId = null;
                pinchStartDistance = getActivePointerDistance();
            }
        }

        function handleCanvasPointerMove(event) {
            if (!activePointers.has(event.pointerId)) return;
            event.preventDefault();

            const pointer = activePointers.get(event.pointerId);
            pointer.x = event.clientX;
            pointer.y = event.clientY;

            if (activePointers.size >= 2) {
                isDragging = false;
                dragPointerId = null;
                const distance = getActivePointerDistance();
                if (distance > 0 && pinchStartDistance !== null && pinchStartDistance > 0) {
                    const zoomAmount = Math.log(pinchStartDistance / distance) * 0.9;
                    applyZoom(zoomAmount);
                }
                pinchStartDistance = distance;
                return;
            }

            if (activePointers.size === 1 && event.pointerId === dragPointerId && isDragging) {
                continuePointerDrag(event.clientX, event.clientY);
            }
        }

        function handleCanvasPointerEnd(event) {
            if (!activePointers.has(event.pointerId)) return;
            event.preventDefault();
            activePointers.delete(event.pointerId);

            if (activePointers.size >= 2) {
                isDragging = false;
                dragPointerId = null;
                pinchStartDistance = getActivePointerDistance();
                return;
            }

            if (activePointers.size === 1) {
                const [remainingId, pointer] = activePointers.entries().next().value;
                dragPointerId = remainingId;
                pinchStartDistance = null;
                beginPointerDrag(pointer.x, pointer.y);
                return;
            }

            isDragging = false;
            dragPointerId = null;
            pinchStartDistance = null;
        }

        function getActivePointerDistance() {
            const points = Array.from(activePointers.values());
            if (points.length < 2) return 0;
            return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        }

        function dismissTouchHint() {
            if (!touchHint || touchHint.classList.contains('dismissed')) return;
            clearTimeout(touchHintTimer);
            touchHintTimer = setTimeout(() => {
                touchHint.classList.add('dismissed');
            }, 900);
        }

        function resizeRendererToViewport() {
            const width = Math.max(1, document.documentElement.clientWidth || window.innerWidth);
            const height = Math.max(1, document.documentElement.clientHeight || window.innerHeight);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(width, height);
        }

        function applyCustomCoordinates() {
            locationPreset.value = 'custom';
            observerLatitudeDeg = THREE.MathUtils.clamp(Number(latitudeInput.value) || 0, -90, 90);
            observerLongitudeDeg = normalizeLongitude(Number(longitudeInput.value) || 0);
            latitudeInput.value = formatCoordinate(observerLatitudeDeg);
            longitudeInput.value = formatCoordinate(observerLongitudeDeg);
            updateObserverFromSimulation(true);
