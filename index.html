<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sun/Moon SVG alignment test</title>
<style>
html,body{margin:0;min-height:100%;background:#061022;color:#8ff7ff;font-family:system-ui,sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center}
.clock{position:relative;width:min(78vw,520px);aspect-ratio:1034/974}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#boardWrap{position:absolute;inset:0;transform-origin:50% 50%;}
#board{width:100%;height:100%;display:block}
#cover{z-index:2}
.controls{position:fixed;left:16px;bottom:16px;right:16px;display:flex;gap:12px;align-items:center;background:#07182dcc;padding:10px 12px;border-radius:10px}
input[type=range]{flex:1}
.value{min-width:80px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <div class="clock">
    <div id="boardWrap"><img id="board" class="layer" src="clock_assets/sunmoon_board.svg" alt=""></div>
    <img id="cover" class="layer" src="clock_assets/cover_ui.svg" alt="">
  </div>
</div>
<div class="controls">
  <span>回転</span><input id="rot" type="range" min="0" max="360" value="0"><span id="val" class="value">0°</span>
</div>
<script>
const rot=document.getElementById('rot');
const wrap=document.getElementById('boardWrap');
const val=document.getElementById('val');
function update(){wrap.style.transform=`rotate(${rot.value}deg)`;val.textContent=rot.value+'°';}
rot.addEventListener('input',update);update();
</script>
</body>
</html>
